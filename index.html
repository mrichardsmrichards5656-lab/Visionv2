<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision Hub</title>

<style>
:root{
  --bg:#0b0c10;
  --bg2:#111218;
  --card:#171923;
  --card2:#1e2230;
  --text:#ffffff;
  --text2:#c7c7c7;
  --border:#2a2f3a;
  --yellow:#f5b800;
  --blue:#4aa3ff;
  --green:#2ecc71;
  --font: system-ui, -apple-system, Arial;
  --scale:1;
}

body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:calc(17px * var(--scale));
}

.skip{
  position:absolute;
  left:-999px;
  top:auto;
}
.skip:focus{
  left:10px;
  top:10px;
  background:#000;
  color:#fff;
  padding:10px;
  z-index:9999;
}

.page{display:none;}
.page.active{display:block;}

.site-header{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:4px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.site-name{font-weight:900; font-size:1.3rem; cursor:pointer;}
.site-tagline{color:var(--text2); font-size:0.9rem;}

.a11y-bar{
  display:flex;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
  background:var(--card2);
}

button{
  min-height:44px;
  cursor:pointer;
}

.hero{padding:20px;}
.hero h1{font-size:2rem;}
.hero-desc{color:var(--text2)}

.cond-item{margin-bottom:10px;}
.cond-btn{
  width:100%;
  text-align:left;
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
}
.cond-btn.on{border-color:var(--yellow);}

.detail-panel{display:none; padding:10px;}
.detail-panel.vis{display:block;}

.wb{
  background:rgba(245,184,0,.1);
  border:1px solid var(--yellow);
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}

footer{padding:20px; border-top:1px solid var(--border);}

.sr{position:absolute;left:-9999px;}

@media print{
  body *{visibility:hidden;}
  .detail-panel.vis, .detail-panel.vis *{visibility:visible;}
  .detail-panel.vis{position:absolute;top:0;left:0;}
}
</style>
</head>

<body>

<a class="skip" href="#main">Skip</a>

<div id="aria-live" class="sr" aria-live="polite"></div>

<header class="site-header">
  <span class="site-name" onclick="showPage('home')">Vision Hub</span>
  <span class="site-tagline">UK Sight Loss Resource</span>
</header>

<div id="page-home" class="page active">
<main id="main">

<div class="hero">
<h1>Everything in one place</h1>
<p class="hero-desc">Accessible sight loss information</p>

<input id="search" placeholder="Search condition..." oninput="filter(this.value)" style="width:100%;padding:12px;margin-top:10px" />
</div>

<section>

<div class="cond-item">
<button class="cond-btn" onclick="toggle('stargardt',this)">Stargardt Disease</button>
<div id="dp-stargardt" class="detail-panel"></div>
</div>

<div class="cond-item">
<button class="cond-btn" onclick="toggle('amd',this)">AMD</button>
<div id="dp-amd" class="detail-panel"></div>
</div>

</section>

</main>
</div>

<script>
const DATA={
stargardt:{
name:"Stargardt",
what:"Inherited macular disease",
guides:[{n:1,title:"Referral",body:"See retina specialist"}],
tech:[{cat:"App",title:"Seeing AI",body:"Free Microsoft app",price:"Free"}],
support:[{title:"RNIB",body:"Support",link:"https://rnib.org.uk"}],
benefits:[{n:1,title:"CVI",body:"Register vision loss"}]
},
amd:{
name:"AMD",
what:"Age-related macular degeneration",
guides:[{n:1,title:"Amsler grid",body:"Check daily"}],
tech:[],
support:[],
benefits:[]
}
};

let open=null;
let btn=null;

function announce(t){
  const el=document.getElementById('aria-live');
  el.textContent='';
  setTimeout(()=>el.textContent=t,50);
}

function toggle(k,b){
  if(open===k){close(k);return;}
  if(open) close(open,false);
  open=k; btn=b;

  b.classList.add('on');

  const p=document.getElementById('dp-'+k);
  p.innerHTML=render(k);
  p.classList.add('vis');

  trap(p);
  announce(k+' opened');

  history.replaceState(null,'','#'+k);
}

function close(k,focus=true){
  const p=document.getElementById('dp-'+k);
  if(p) p.classList.remove('vis');
  if(btn){btn.classList.remove('on');}
  open=null;
  announce('closed');
}

function render(k){
  const d=DATA[k];
  return `<div><p>${d.what}</p></div>`;
}

function trap(p){
  const f=p.querySelectorAll('button,a');
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];

  p.onkeydown=e=>{
    if(e.key!=='Tab')return;
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
}

function filter(q){
  document.querySelectorAll('.cond-item').forEach(i=>{
    i.style.display=i.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}

(function hash(){
  const k=location.hash.replace('#','');
  if(k){const b=document.querySelector('[onclick*="'+k+'"]');if(b)toggle(k,b);}
})();
</script>

</body>
</html>
