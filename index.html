<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision Hub — UK Sight Loss Platform</title>
<style>
:root{
  --bg:#0b0f14;
  --card:#121923;
  --text:#eaf0ff;
  --text2:#b7c3d9;
  --accent:#4da3ff;
  --yellow:#ffd34d;
  --scale:1;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  font-size:calc(16px * var(--scale));
}
a{color:var(--accent)}
header{
  display:flex;
  justify-content:space-between;
  padding:16px;
  border-bottom:1px solid #1f2b3a;
}
.site{font-weight:800}
.container{max-width:1000px;margin:auto;padding:18px}
.search{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3b52;background:#0f1622;color:var(--text);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--card);padding:14px;border-radius:12px;cursor:pointer;border:1px solid #1f2c3f}
.card:hover{border-color:var(--accent)}
.panel{display:none;margin-top:16px}
.panel.vis{display:block}
.block{background:var(--card);padding:14px;border-radius:12px;margin-bottom:10px}
button{cursor:pointer}
.close{background:#1d2a3d;border:none;color:white;padding:8px 12px;border-radius:8px}
.small{color:var(--text2)}
</style>
</head>
<body>
<header>
<div class="site">◈ Vision Hub</div>
</header><div class="container">
<input class="search" id="search" placeholder="Search conditions..." oninput="filter(this.value)" /><div class="grid" id="grid"></div><div id="panel"></div></div><script>
const DATA = {

stargardts:{
name:"Stargardt Disease",
what:"Inherited macular dystrophy caused by ABCA4 gene mutations.",
vision:"Central vision loss, reading difficulty, light sensitivity.",
diagnosis:"OCT, genetic testing, retinal imaging.",
who:"Usually onset 6–20 years, rare inherited condition.",
guides:["Referral to retinal specialist","Vision protection advice"],
tech:["Seeing AI","Magnifiers"],
support:["RNIB","Macular Society"]
},

amd:{
name:"Age-Related Macular Degeneration",
what:"Degeneration of macula in older adults.",
vision:"Blurred central vision, distortion.",
diagnosis:"Eye scans (OCT)",
who:"Over 50s, smoking increases risk",
guides:["Amsler grid daily monitoring"],
tech:["CCTV magnifier","Anti-VEGF injections"],
support:["Macular Society","RNIB"]
},

glaucoma:{
name:"Glaucoma",
what:"Optic nerve damage from raised eye pressure.",
vision:"Peripheral vision loss.",
diagnosis:"Pressure + visual field tests.",
who:"Over 60 or family history",
guides:["Eye drops adherence"],
tech:["Drop aids"],
support:["Glaucoma UK","RNIB"]
},

rp:{
name:"Retinitis Pigmentosa",
what:"Inherited retinal degeneration.",
vision:"Night blindness, tunnel vision.",
diagnosis:"ERG + genetics.",
who:"1 in 4,000",
guides:["Mobility cane training"],
tech:["Seeing AI"],
support:["Retina UK"]
},

diabetic:{
name:"Diabetic Retinopathy",
what:"Retina damage from diabetes.",
vision:"Often no early symptoms.",
diagnosis:"NHS screening",
who:"People with diabetes",
guides:["Annual screening essential"],
tech:["CGM glucose monitoring"],
support:["Diabetes UK"]
},

cataract:{
name:"Cataract",
what:"Clouding of the eye lens.",
vision:"Blurry, foggy vision.",
diagnosis:"Eye examination",
who:"Common in older adults",
guides:["Surgery is highly effective"],
tech:["Magnifiers"],
support:["RNIB"]
},

retinal_detachment:{
name:"Retinal Detachment",
what:"Retina pulls away from back of eye.",
vision:"Flashes, curtain vision loss.",
diagnosis:"Emergency eye exam",
who:"Myopia increases risk",
guides:["Emergency A&E immediately"],
tech:["Surgical repair"],
support:["RNIB"]
},

myopia_degeneration:{
name:"Pathologic Myopia",
what:"Severe short-sightedness causing retinal stretching.",
vision:"Progressive vision distortion.",
diagnosis:"Eye scans",
who:"High myopia patients",
guides:["Regular monitoring"],
tech:["Corrective lenses"],
support:["RNIB"]
},

uveitis:{
name:"Uveitis",
what:"Inflammation inside the eye.",
vision:"Pain, redness, blurred vision.",
diagnosis:"Eye exam + tests",
who:"Autoimmune conditions linked",
guides:["Urgent treatment required"],
tech:["Steroid drops"],
support:["RNIB"]
}

};

function render(key){
const d = DATA[key];
if(!d) return "";
return `
<div class='block'>
<h2>${d.name}</h2>
<p><b>What:</b> ${d.what}</p>
<p><b>Vision:</b> ${d.vision}</p>
<p><b>Diagnosis:</b> ${d.diagnosis}</p>
<p><b>Affected:</b> ${d.who}</p>
<p><b>Guides:</b> ${d.guides.join(", ")}</p>
<p><b>Tech:</b> ${d.tech.join(", ")}</p>
<p><b>Support:</b> ${d.support.join(", ")}</p>
<button class='close' onclick='closePanel()'>Close</button>
</div>`;
}

let open=null;

function openPanel(k){
open=k;
document.getElementById('panel').innerHTML = render(k);
}

function closePanel(){
document.getElementById('panel').innerHTML="";
open=null;
}

function filter(q){
q=q.toLowerCase();
let grid=document.getElementById('grid');
grid.innerHTML="";
Object.keys(DATA).forEach(k=>{
if(k.includes(q)||DATA[k].name.toLowerCase().includes(q)){
grid.innerHTML += `<div class='card' onclick=\"openPanel('${k}')\">${DATA[k].name}</div>`;
}
});
}

// init
filter("");
</script></body>
</html>
